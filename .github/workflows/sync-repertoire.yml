name: Sync student repertoire

on:
  push:
    paths:
      - '.github/workflows/sync-repertoire.yml'
      - 'scripts/sync-repertoire.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
  schedule:
    - cron: '17 10 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec node scripts/sync-repertoire.mjs
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      - run: |
          git diff --quiet -- public/repertoire.json || {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/repertoire.json
            git commit -m 'Sync student repertoire'
            git push
          }
      - run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
